<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doc2testcases · 测试用例生成控制台</title>
<style>
:root {
  --bg: #f5f6f8; --card: #fff; --line: #e3e6ea; --text: #1f2329; --muted: #8a919c;
  --brand: #3565e0; --brand-weak: #eef3fe; --ok: #1f9d55; --ok-weak: #e8f7ef;
  --warn: #c8871a; --warn-weak: #fdf3e3; --err: #d64545; --err-weak: #fdeeee;
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
       background: var(--bg); color: var(--text); }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
h1 { font-size: 20px; margin: 0; }
h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
.hdr-right { display: flex; align-items: center; gap: 10px; }
.model-chip { color: var(--muted); font-size: 12px; background: var(--card);
              border: 1px solid var(--line); padding: 3px 10px; border-radius: 12px; }
button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line);
         background: var(--card); color: var(--text); padding: 6px 14px; }
button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { border: none; background: none; color: var(--brand); padding: 2px 6px; }
button.link.danger { color: var(--err); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 18px; margin-bottom: 16px; }
.drop { border: 1.5px dashed #c4cbd4; border-radius: 10px; padding: 26px 16px; text-align: center;
        color: var(--muted); transition: .15s; }
.drop.on { border-color: var(--brand); background: var(--brand-weak); color: var(--brand); }
.files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-weak);
             color: var(--brand); border-radius: 14px; padding: 3px 6px 3px 12px; font-size: 13px; }
.file-chip .x { cursor: pointer; font-weight: 700; padding: 0 6px; border-radius: 50%; }
.fmt-pick { font-size: 13px; color: var(--muted); }
.fmt-opts { display: inline-flex; gap: 12px; flex-wrap: wrap; margin-left: 6px; }
.fmt-opts label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px;
                  color: var(--text); cursor: pointer; user-select: none; }
.fmt-opts input[type="checkbox"] { width: auto; padding: 0; accent-color: var(--brand); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
select, input { font: inherit; padding: 6px 10px; border: 1px solid var(--line);
                border-radius: 7px; background: #fff; color: var(--text); }
.job { border: 1px solid var(--line); border-radius: 12px; background: var(--card);
       padding: 16px; margin-bottom: 14px; }
.job-hdr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.job-id { font-weight: 600; }
.job-time { color: var(--muted); font-size: 12px; }
.badge { font-size: 12px; border-radius: 12px; padding: 2px 10px; border: 1px solid transparent; }
.b-queued   { background: #eef0f3; color: var(--muted); }
.b-running  { background: var(--brand-weak); color: var(--brand); }
.b-done     { background: var(--ok-weak); color: var(--ok); }
.b-failed, .b-interrupted { background: var(--err-weak); color: var(--err); }
.b-canceled { background: var(--warn-weak); color: var(--warn); }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line);
         vertical-align: top; word-break: break-all; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
.stage { display: inline-block; font-size: 12px; border-radius: 10px; padding: 1px 9px;
         background: #eef0f3; color: var(--muted); white-space: nowrap; }
.stage.s-done { background: var(--ok-weak); color: var(--ok); }
.stage.s-parsing, .stage.s-generating, .stage.s-reviewing, .stage.s-rendering {
  background: var(--brand-weak); color: var(--brand); }
.stage.s-failed { background: var(--err-weak); color: var(--err); }
.mini { font-size: 12px; border-radius: 10px; padding: 1px 8px; white-space: nowrap; }
.m-ok  { background: var(--ok-weak); color: var(--ok); }
.m-warn{ background: var(--warn-weak); color: var(--warn); }
.m-err { background: var(--err-weak); color: var(--err); }
.m-gray{ background: #eef0f3; color: var(--muted); }
.findings { margin-top: 8px; background: #fafbfc; border: 1px solid var(--line);
            border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.findings li { margin: 2px 0; }
.notes { color: var(--warn); }
.dl-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.dl-row a { text-decoration: none; font-size: 13px; color: var(--brand);
            border: 1px solid var(--brand); border-radius: 7px; padding: 3px 12px; }
.dl-row a.disabled { color: var(--muted); border-color: var(--line);
                     pointer-events: none; background: #f6f7f9; }
.err-line { color: var(--err); font-size: 13px; margin-top: 8px; }
.actions { margin-left: auto; display: flex; gap: 6px; }
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
dialog { border: none; border-radius: 14px; padding: 0; width: min(480px, 92vw);
         box-shadow: 0 18px 60px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(20,24,30,.4); }
.dlg-body { padding: 20px 22px; }
.dlg-body h3 { margin: 0 0 4px; }
.dlg-body p.tip { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select { width: 100%; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.dlg-msg { font-size: 13px; margin-top: 12px; border-radius: 7px; padding: 7px 10px; }
.dlg-msg.ok  { background: var(--ok-weak); color: var(--ok); }
.dlg-msg.err { background: var(--err-weak); color: var(--err); word-break: break-all; }
.progress { height: 6px; background: #eef0f3; border-radius: 4px; overflow: hidden; margin-top: 12px; }
.progress-bar { height: 100%; border-radius: 4px; background: var(--brand); transition: width .6s ease; }
.progress-bar.run  { background: linear-gradient(90deg, #7ea1ec, var(--brand)); animation: pulse 1.6s ease infinite; }
.progress-bar.done { background: var(--ok); }
.progress-bar.fail { background: var(--err); }
@keyframes pulse { 50% { opacity: .55; } }
.progress-text { color: var(--muted); font-size: 12px; margin-top: 5px; }
.toast { position: fixed; top: 18px; right: 18px; z-index: 99; padding: 9px 16px; border-radius: 8px;
         font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.14); transition: opacity .4s, transform .4s; }
.toast.t-ok  { background: var(--ok-weak); color: var(--ok); }
.toast.t-err { background: var(--err-weak); color: var(--err); }
.toast.out { opacity: 0; transform: translateY(-8px); }
#btnLogs { position: relative; }
#logBadge { position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px;
            line-height: 16px; border-radius: 9px; background: var(--err); color: #fff;
            font-size: 11px; padding: 0 4px; display: none; }
#logDlg { width: min(880px, 94vw); }
.log-bar { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.log-bar button { padding: 3px 12px; font-size: 12.5px; }
.log-bar button.on { background: var(--brand-weak); color: var(--brand); border-color: var(--brand); }
.log-bar label { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.log-list { font: 12px/1.75 Consolas, "Courier New", monospace; background: #fafbfc;
            border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
            height: 400px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; word-break: break-all; }
.log-list .lv-info  { color: var(--muted); }
.log-list .lv-warn  { color: var(--warn); }
.log-list .lv-error { color: var(--err); font-weight: 600; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--brand);
        border-top-color: transparent; border-radius: 50%; animation: rot .8s linear infinite;
        vertical-align: -2px; margin-right: 4px; }
@keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>doc2testcases <small>需求文档 → 测试用例（xls / yaml / json / md / xmind）</small></h1>
    <div class="hdr-right">
      <span class="model-chip" id="modelChip">—</span>
      <button id="btnLogs">📋 日志<span id="logBadge"></span></button>
      <button id="btnSettings">⚙ 设置</button>
    </div>
  </header>

  <div class="card">
    <div class="drop" id="drop">
      拖拽需求文档到此处，或点击选择文件<br>
      <span style="font-size:12px">支持 md / pdf / docx / xlsx / xls，可多选</span>
      <input type="file" id="fileInput" multiple accept=".md,.pdf,.docx,.xlsx,.xls" hidden>
    </div>
    <div class="files" id="fileList"></div>
    <div class="row">
      <label>评审修订轮数
        <select id="rounds">
          <option value="1">1 轮（更快）</option>
          <option value="2" selected>2 轮（推荐）</option>
          <option value="0">0 轮（仅生成+评审结论，不修订）</option>
        </select>
      </label>
      <span class="fmt-pick">输出格式
        <span class="fmt-opts" id="fmtOpts">
          <label><input type="checkbox" value="xls" checked> Excel</label>
          <label><input type="checkbox" value="yaml"> YAML</label>
          <label><input type="checkbox" value="json"> JSON</label>
          <label><input type="checkbox" value="md"> Markdown</label>
          <label><input type="checkbox" value="xmind"> XMind</label>
        </span>
      </span>
      <button class="primary" id="btnStart">开始生成</button>
      <span id="startHint" style="color:var(--muted);font-size:12.5px"></span>
    </div>
  </div>

  <div id="jobs"><div class="empty">暂无任务</div></div>
</div>

<dialog id="dlg">
  <form class="dlg-body" id="settingsForm" method="dialog">
    <h3>模型设置</h3>
    <p class="tip">选择厂商后只需粘贴该家的 API Key——各厂 Key 分开保存，来回切换不用重填。
      Key 仅存本机 <code>data/doc2tc.db</code>，不会上传到任何地方。</p>
    <div class="field"><label>服务商</label>
      <select id="sProvider"></select></div>
    <div class="field"><label>模型（选择内置型号，或「手动输入」任意模型 ID）</label>
      <select id="sModelSel"></select>
      <input id="sModelManual" placeholder="输入任意模型 ID" autocomplete="off"
             style="display:none; margin-top:8px"></div>
    <div id="customModelMgr" style="display:none; margin:-6px 0 4px; font-size:12.5px">
      <button type="button" class="link" id="btnSaveModel">＋ 把当前模型存为常用</button>
      <button type="button" class="link danger" id="btnRemoveModel" style="display:none">移除当前常用</button>
    </div>
    <div class="field"><label>API Key <a id="keyUrl" target="_blank" rel="noopener"
        style="float:right;font-size:12px"></a></label>
      <input type="password" id="sKey" placeholder="粘贴该厂商的 API Key" autocomplete="off"></div>
    <div id="customFields" style="display:none">
      <div class="field"><label>Base URL（OpenAI 或 Anthropic 兼容端点）</label>
        <input id="sBase" placeholder="https://your-endpoint/v1"></div>
      <div class="field"><label>接口风格</label>
        <select id="sStyle">
          <option value="openai">OpenAI 兼容（/chat/completions）</option>
          <option value="anthropic">Anthropic 风格（/v1/messages）</option>
        </select></div>
    </div>
    <div class="dlg-msg" id="dlgMsg" style="display:none"></div>
    <div class="dlg-foot">
      <button type="button" id="dlgCancel">取消</button>
      <button type="button" id="dlgTest">测试连接</button>
      <button type="button" class="primary" id="dlgSave">保存</button>
    </div>
  </form>
</dialog>

<dialog id="logDlg">
  <div class="dlg-body">
    <h3>运行日志 <small style="color:var(--muted);font-weight:400">实时 · 进程重启后清空</small></h3>
    <div class="log-bar">
      <button data-lv="all" class="on">全部</button>
      <button data-lv="info">INFO</button>
      <button data-lv="warn">WARN</button>
      <button data-lv="error">ERROR</button>
      <button type="button" id="logClear" style="margin-left:8px">清屏</button>
      <label><input type="checkbox" id="logAutoScroll" checked> 自动滚动</label>
    </div>
    <div id="logList" class="log-list"></div>
    <div class="dlg-foot"><button type="button" class="primary" id="logClose">关闭</button></div>
  </div>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
let picked = [];          // {name, file}
let jobsCache = [];

const STAGE_TEXT = { queued: "排队中", parsing: "解析文档", generating: "生成用例",
  reviewing: "评审/修订", rendering: "渲染五格式", done: "完成", failed: "失败",
  skipped: "跳过" };
const STATUS_TEXT = { queued: "排队中", running: "运行中", done: "已完成", failed: "失败",
  canceled: "已取消", interrupted: "已中断" };
const FMT_LABEL = { xls: "Excel", yaml: "YAML", json: "JSON", md: "Markdown", xmind: "XMind" };

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function toast(text, ok = true) {   // 右上角轻量动作反馈
  const t = document.createElement("div");
  t.className = "toast " + (ok ? "t-ok" : "t-err");
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("out"), 2200);
  setTimeout(() => t.remove(), 2700);
}

/* ---------------- 设置 ---------------- */
let PROVIDER_LIST = [], settingsCache = null;
async function loadSettings() {
  try {
    const [ps, s] = await Promise.all([
      (await fetch("/api/providers")).json(),
      (await fetch("/api/settings")).json()]);
    PROVIDER_LIST = ps.providers; settingsCache = s;
    $("#sProvider").innerHTML = PROVIDER_LIST.map(p =>
      `<option value="${esc(p.id)}">${esc(p.label)}${p.key_configured ? " ·Key已配" : ""}</option>`).join("");
    $("#sProvider").value = s.provider;   // 回填已保存厂商（否则下拉回落第一项，保存/测试会写错槽）
    applyProvider(s.provider, s);
    const label = (PROVIDER_LIST.find(p => p.id === s.provider) || {}).label || s.provider;
    const keyOk = s.keys_configured && s.keys_configured[s.provider];
    $("#modelChip").textContent = s.model ? `${label} · ${s.model} · ${keyOk ? "Key 已配置" : "未配置 Key"}` : "—";
    $("#startHint").textContent = keyOk ? "" : "先在「设置」里保存当前厂商的 API Key";
  } catch (e) { console.error(e); }
}
function applyProvider(pid, s) {
  const p = PROVIDER_LIST.find(x => x.id === pid) || PROVIDER_LIST[0];
  fillModels(pid, s, p);
  $("#sKey").value = "";
  $("#sKey").placeholder = p.key_configured ? "已配置（留空则不更改）" : "粘贴该厂商的 API Key";
  const ku = $("#keyUrl");
  if (p.key_url) { ku.href = p.key_url; ku.textContent = "获取 Key ↗"; ku.style.display = ""; }
  else ku.style.display = "none";
  $("#customFields").style.display = pid === "custom" ? "" : "none";
  $("#customModelMgr").style.display = pid === "custom" ? "" : "none";
  if (pid === "custom") {
    $("#sBase").value = (s.custom && s.custom.base_url) || "";
    $("#sStyle").value = (s.custom && s.custom.style) || "openai";
  }
}
function fillModels(pid, s, p) {
  const cur = (s.model_by_provider && s.model_by_provider[pid]) || p.default_model || "";
  // custom 的下拉选项来自用户自管的常用清单，内置厂商来自静态预设
  const models = pid === "custom" ? (s.custom && s.custom.models) || [] : (p.models || []);
  $("#sModelSel").innerHTML =
    models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("") +
    `<option value="__manual__">手动输入…</option>`;
  if (cur && !models.includes(cur)) {   // 当前值不在预设里（手输值/custom）：显示手动框
    $("#sModelSel").value = "__manual__";
    $("#sModelManual").style.display = "";
    $("#sModelManual").value = cur;
  } else {
    $("#sModelSel").value = cur || "__manual__";
    $("#sModelManual").style.display = cur ? "none" : "";
    $("#sModelManual").value = "";
  }
  refreshModelMgr();
}
function currentModelValue() {
  return $("#sModelSel").value === "__manual__"
    ? $("#sModelManual").value.trim() : $("#sModelSel").value;
}
function refreshModelMgr() {   // 「移除当前常用」仅当选中的确是常用项时出现
  const list = (settingsCache && settingsCache.custom && settingsCache.custom.models) || [];
  $("#btnRemoveModel").style.display = list.includes(currentModelValue()) ? "" : "none";
}
$("#sModelSel").onchange = () => {
  const manual = $("#sModelSel").value === "__manual__";
  $("#sModelManual").style.display = manual ? "" : "none";
  if (manual) { $("#sModelManual").value = ""; $("#sModelManual").focus(); }
  refreshModelMgr();
};
$("#sModelManual").oninput = refreshModelMgr;
$("#btnSaveModel").onclick = async () => {   // 收藏当前模型：进常用清单并设为当前
  if ($("#sProvider").value !== "custom") return;   // 仅 custom 可管清单（防误触发写错槽）
  const cur = currentModelValue();
  if (!cur) { showMsg("请先选择或输入一个模型", false); return; }
  const list = (settingsCache && settingsCache.custom && settingsCache.custom.models) || [];
  const r = await fetch("/api/settings", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ provider: "custom", model: cur,
                           models_custom: [...new Set([...list, cur])] }) });
  if (r.ok) { await loadSettings(); showMsg(`✓ 已把「${cur}」存为常用模型`, true); }
  else showMsg("✗ 保存失败: " + (await r.json()).detail, false);
};
$("#btnRemoveModel").onclick = async () => {   // 从常用清单移除（当前使用不受影响）
  if ($("#sProvider").value !== "custom") return;
  const cur = currentModelValue();
  const list = (settingsCache && settingsCache.custom && settingsCache.custom.models) || [];
  const r = await fetch("/api/settings", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ provider: "custom", models_custom: list.filter(m => m !== cur) }) });
  if (r.ok) { await loadSettings(); showMsg(`✓ 已从常用清单移除「${cur}」（当前使用不受影响）`, true); }
  else showMsg("✗ 移除失败: " + (await r.json()).detail, false);
};
$("#sProvider").onchange = () => applyProvider($("#sProvider").value, settingsCache);
$("#btnSettings").onclick = () => { loadSettings(); $("#dlg").showModal(); };
$("#dlgCancel").onclick = () => $("#dlg").close();
function collectConfig() {   // 对话框当前配置（保存与测试共用）
  const body = { provider: $("#sProvider").value };
  const model = $("#sModelSel").value === "__manual__"
    ? $("#sModelManual").value.trim() : $("#sModelSel").value;
  if (model) body.model = model;
  if ($("#sKey").value.trim()) body.api_key = $("#sKey").value.trim();
  if (body.provider === "custom") {
    if ($("#sBase").value.trim()) body.base_url_custom = $("#sBase").value.trim();
    body.style_custom = $("#sStyle").value;
  }
  return body;
}
function showMsg(text, ok) {   // 对话框内统一消息行（保存/测试共用）
  const el = $("#dlgMsg");
  el.className = "dlg-msg " + (ok ? "ok" : "err");
  el.textContent = text;
  el.style.display = "block";
}
$("#dlgTest").onclick = async () => {
  const btn = $("#dlgTest");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>测试中…';
  $("#dlgMsg").style.display = "none";
  // 传输层有 requests->urllib->curl 多级降级，最坏可达 ~2 分钟；35s 先行提示避免用户干等
  const slowTimer = setTimeout(() =>
    showMsg("⚠ 超过 35 秒仍未响应：网络不通或端点无响应，可稍后再试", false), 35000);
  try {
    const r = await fetch("/api/test", { method: "POST", headers: { "content-type": "application/json" },
                                         body: JSON.stringify(collectConfig()) });
    const d = await r.json();
    if (d.ok) showMsg(`✓ 测试通过 · ${d.model} · ${(d.latency_ms / 1000).toFixed(1)}s · 模型回复：${d.reply}`, true);
    else showMsg(`✗ 测试失败：${d.error}`, false);
  } catch (e) {
    showMsg("✗ 请求失败: " + e.message, false);
  } finally {
    clearTimeout(slowTimer);
    btn.disabled = false; btn.textContent = "测试连接";
  }
};
$("#dlgSave").onclick = async () => {
  const btn = $("#dlgSave");
  btn.disabled = true; btn.textContent = "保存中…";
  $("#dlgMsg").style.display = "none";
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "content-type": "application/json" },
                                             body: JSON.stringify(collectConfig()) });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    await loadSettings();                       // 刷新对话框内 Key 占位/厂商标记与顶栏 chip（对话框保持打开）
    btn.textContent = "✓ 已保存";
    showMsg("✓ 已保存（Key 仅存本机 data/doc2tc.db）", true);
    setTimeout(() => { btn.disabled = false; btn.textContent = "保存"; }, 1200);
  } catch (e) {
    btn.disabled = false; btn.textContent = "保存";
    showMsg("✗ 保存失败: " + e.message, false);
  }
};

/* ---------------- 上传 ---------------- */
const drop = $("#drop");
drop.onclick = () => $("#fileInput").click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("on"); };
drop.ondragleave = () => drop.classList.remove("on");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("on"); addFiles(e.dataTransfer.files); };
$("#fileInput").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
const OK_EXT = /\.(md|pdf|docx|xlsx|xls)$/i;
function addFiles(list) {
  for (const f of list) {
    if (!OK_EXT.test(f.name)) { alert(`不支持的格式: ${f.name}`); continue; }
    if (picked.some(p => p.name === f.name)) continue;
    picked.push({ name: f.name, file: f });
  }
  renderPicked();
}
function renderPicked() {
  $("#fileList").innerHTML = picked.map((p, i) =>
    `<span class="file-chip">${esc(p.name)}<span class="x" data-i="${i}">×</span></span>`).join("");
  $("#fileList").querySelectorAll(".x").forEach(x => x.onclick = () => {
    picked.splice(+x.dataset.i, 1); renderPicked(); });
}
$("#btnStart").onclick = async () => {
  if (!picked.length) { alert("请先选择文档"); return; }
  const fmts = [...document.querySelectorAll("#fmtOpts input:checked")].map(c => c.value);
  if (!fmts.length) { alert("请至少选择一种输出格式"); return; }
  const fd = new FormData();
  picked.forEach(p => fd.append("files", p.file, p.name));
  fd.append("rounds", $("#rounds").value);
  fd.append("formats", fmts.join(","));
  $("#btnStart").disabled = true; $("#btnStart").textContent = "上传中…";
  try {
    const r = await fetch("/api/jobs", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.status);
    picked = []; renderPicked(); refresh(true);
    toast("✓ 任务已创建，正在生成用例…");
  } catch (e) { toast("✗ 创建任务失败: " + e.message, false); }
  finally { $("#btnStart").disabled = false; $("#btnStart").textContent = "开始生成"; }
};

/* ---------------- 任务列表 ---------------- */
function countsText(c) {
  if (!c || !c.total) return "—";
  return `${c.total} 条（P0 ${c.P0}/P1 ${c.P1}/P2 ${c.P2}）`;
}
function docRow(d) {
  const stage = `<span class="stage s-${esc(d.stage)}">${STAGE_TEXT[d.stage] || d.stage}</span>`;
  let verdict = '<span class="mini m-gray">—</span>';
  if (d.stage === "failed") verdict = '<span class="mini m-err">失败</span>';
  else if (d.approved === true) verdict = '<span class="mini m-ok">评审通过</span>' + (d.reused ? ' <span class="mini m-gray">续跑复用</span>' : "");
  else if (d.approved === false) verdict = '<span class="mini m-warn">仍有评审意见</span>';
  const extra = [];
  if (d.notes) extra.push(`<div class="notes">备注：${esc(d.notes)}</div>`);
  if (d.error) extra.push(`<div class="err-line">${esc(d.error)}</div>`);
  if (d.findings && d.findings.length) extra.push(
    `<div class="findings"><b>未决评审意见</b><ul>` +
    d.findings.map(f => `<li><span class="mini ${f.severity === "high" ? "m-err" : f.severity === "medium" ? "m-warn" : "m-gray"}">${esc(f.severity)}</span> ${esc(f.what)}</li>`).join("") +
    `</ul></div>`);
  return `<tr><td>${esc(d.name)}</td><td>${stage}</td><td>${esc(d.module || "—")}</td>
    <td>${countsText(d.counts)}</td><td>${verdict}</td></tr>
    ${extra.length ? `<tr><td colspan="5" style="border-bottom:none;padding-top:0">${extra.join("")}</td></tr>` : ""}`;
}
/* 阶段 -> 完成度权重（总进度 = 各文档均值；终态文档按 100 计） */
const STAGE_PCT = { queued: 2, parsing: 10, generating: 40, reviewing: 72, rendering: 92,
                    done: 100, failed: 100, skipped: 100 };
function jobProgress(j) {
  if (j.status === "done") return 100;
  if (!j.docs || !j.docs.length) return j.status === "running" ? 5 : 0;
  return Math.round(j.docs.reduce((a, d) => a + (STAGE_PCT[d.stage] ?? 0), 0) / j.docs.length);
}
function jobCard(j) {
  const running = j.running || j.status === "running" || j.status === "queued";
  const render = j.render || {};
  const files = render.files || [];
  // 只展示该任务请求的格式（老任务无 formats 参数 -> 展示实际产物/全部五项）
  const wanted = j.params?.formats?.length ? j.params.formats
               : (files.length ? files : Object.keys(FMT_LABEL));
  const dl = wanted.map(fmt => {
    const ok = files.includes(fmt);
    return `<a class="${ok ? "" : "disabled"}" href="/api/jobs/${j.id}/download/${fmt}">⬇ ${FMT_LABEL[fmt] || fmt}</a>`;
  }).join("");
  const renderBadge = render.files && render.files.length
    ? (render.ok ? '<span class="mini m-ok">回读校验通过</span>'
                 : '<span class="mini m-err">校验未通过</span>')
    : "";
  const time = new Date(j.created_at).toLocaleString("zh-CN", { hour12: false });
  const actions = [
    running ? `<button class="link danger" data-act="cancel" data-id="${j.id}">取消</button>` : "",
    ["failed", "canceled", "interrupted", "done"].includes(j.status)
      ? `<button class="link" data-act="retry" data-id="${j.id}" title="已完成文档复用结果，仅重跑失败部分">重试续跑</button>
         <button class="link" data-act="fresh" data-id="${j.id}" title="忽略缓存全部重新生成">重新生成</button>` : "",
    !running ? `<button class="link danger" data-act="del" data-id="${j.id}">删除</button>` : "",
  ].join("");
  const pct = jobProgress(j);
  const finishedDocs = (j.docs || []).filter(d => ["done", "failed", "skipped"].includes(d.stage)).length;
  const barCls = j.status === "done" ? "done"
               : ["failed", "canceled", "interrupted"].includes(j.status) ? "fail" : "run";
  const total = j.docs?.length || j.params?.files?.length || 0;
  const progHtml = `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar ${barCls}" style="width:${pct}%"></div></div>
    <div class="progress-text">${pct}%${total ? ` · ${finishedDocs}/${total} 份文档完成` : ""}${running ? " · 处理中…" : ""}</div>`;
  return `<div class="job" id="job-${j.id}">
    <div class="job-hdr">
      <span class="job-id">${esc(j.id)}</span>
      <span class="job-time">${time} · ${j.params?.files?.length || 0} 份文档 · 修订≤${j.params?.rounds ?? "-"} 轮</span>
      <span class="badge b-${esc(j.status)}">${running ? '<span class="spin"></span>' : ""}${STATUS_TEXT[j.status] || j.status}</span>
      <span class="actions">${actions}</span>
    </div>
    ${progHtml}
    ${j.docs?.length ? `<table><tr><th>文档</th><th>阶段</th><th>模块</th><th>用例</th><th>评审</th></tr>
      ${j.docs.map(docRow).join("")}</table>` : ""}
    ${j.error && j.status !== "done" ? `<div class="err-line">${esc(j.error)}</div>` : ""}
    ${render.files || render.failures?.length
      ? `<div class="dl-row">${renderBadge} ${dl}</div>` : ""}
  </div>`;
}
async function refresh(now) {
  try {
    const j = await (await fetch("/api/jobs")).json();
    jobsCache = j.jobs || [];
    $("#jobs").innerHTML = jobsCache.length ? jobsCache.map(jobCard).join("")
                                            : '<div class="empty">暂无任务</div>';
    bindActions();
  } catch (e) { /* 服务重启中 */ }
  if (hasRunning) pollLogs(false);   // 任务运行时顺带增量拉日志（面板关着仅更新徽章，不渲染）
}
function bindActions() {
  document.querySelectorAll("button[data-act]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id, act = b.dataset.act;
    if (act === "del" && !confirm("删除该任务及其产物？")) return;
    b.disabled = true;
    const ACT_TEXT = { cancel: "取消中…", retry: "重试中…", fresh: "重跑中…", del: "删除中…" };
    const ACT_DONE = { cancel: "已请求取消", retry: "已开始重试续跑", fresh: "已开始重新生成", del: "已删除" };
    const origin = b.textContent;
    b.textContent = ACT_TEXT[act] || "处理中…";
    const url = act === "cancel" ? `/api/jobs/${id}/cancel`
              : act === "retry" ? `/api/jobs/${id}/retry`
              : act === "fresh" ? `/api/jobs/${id}/retry?fresh=true`
              : `/api/jobs/${id}`;
    try {
      const r = await fetch(url, { method: act === "del" ? "DELETE" : "POST" });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      toast("✓ " + (ACT_DONE[act] || "已完成"));
    } catch (e) {
      toast("✗ 操作失败: " + e.message, false);
      b.disabled = false; b.textContent = origin;
    }
    refresh(true);
  });
}
/* ---------------- 实时日志（面板打开才轮询；关闭即停，服务端无订阅者零开销） ---------------- */
let logEntries = [], logFilter = "all", logLastSeq = 0, logTimer = null;
async function pollLogs(first) {
  if (first) { logEntries = []; logLastSeq = 0; }   // 重开面板：重建全量，避免重复追加
  try {
    const d = await (await fetch(`/api/logs?after=${first ? 0 : logLastSeq}`)).json();
    if (d.entries.length) {
      logEntries.push(...d.entries);
      logLastSeq = d.last_seq;
      if (logEntries.length > 1500) logEntries = logEntries.slice(-1000);   // 前端也封顶
      if ($("#logDlg").open) renderLogs();
    }
    updateLogBadge();
  } catch (e) { /* 服务重启中 */ }
}
function renderLogs() {
  const keep = logFilter === "all" ? logEntries : logEntries.filter(e => e.level === logFilter);
  const el = $("#logList");
  el.innerHTML = keep.map(e => {
    const t = new Date(e.ts * 1000).toLocaleTimeString("zh-CN", { hour12: false });
    return `<div class="lv-${esc(e.level)}">${t} ${e.level.toUpperCase().padEnd(5, " ")} [${esc(e.tag)}] ${esc(e.msg)}</div>`;
  }).join("");
  if ($("#logAutoScroll").checked) el.scrollTop = el.scrollHeight;
}
function updateLogBadge() {
  const errs = logEntries.filter(e => e.level === "error").length;
  const b = $("#logBadge");
  b.style.display = errs ? "block" : "none";
  b.textContent = errs > 99 ? "99+" : errs;
}
function startLogPolling() { stopLogPolling(); logTimer = setInterval(() => pollLogs(false), 1500); }
function stopLogPolling() { if (logTimer) { clearInterval(logTimer); logTimer = null; } }
$("#btnLogs").onclick = () => { pollLogs(true).then(renderLogs); $("#logDlg").showModal(); startLogPolling(); };
$("#logDlg").addEventListener("close", stopLogPolling);
$("#logClose").onclick = () => $("#logDlg").close();
$("#logClear").onclick = () => { logEntries = []; renderLogs(); updateLogBadge(); };
$("#logAutoScroll").onchange = renderLogs;
document.querySelectorAll(".log-bar button[data-lv]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".log-bar button[data-lv]").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  logFilter = b.dataset.lv;
  renderLogs();
});

let hasRunning = false;
setInterval(() => {
  const running = jobsCache.some(j => j.running || j.status === "running" || j.status === "queued");
  if (running !== hasRunning) { hasRunning = running; refresh(); }
}, 2000);   // 有任务运行时加速刷新
setInterval(refresh, 8000);
loadSettings(); refresh();
</script>
</body>
</html>
